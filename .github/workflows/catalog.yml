# Confere os manifestos e o catalog.json em todo PR e em todo push no main.
# A função `mods` do Supabase entrega o catalog.json do main ao app e ao site:
# um catálogo quebrado no main chegaria a todo mundo, então ele só entra
# conferido e em dia com os manifestos.
name: Conferir o catálogo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    name: Catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do validador
        run: node --test scripts/catalog.test.mjs
      - name: Manifestos e catalog.json
        run: node scripts/catalog.mjs check
